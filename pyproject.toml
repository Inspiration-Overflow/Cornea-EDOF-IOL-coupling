[project]
name = "cornea-edof-iol-coupling"
version = "0.1.0"
description = "Zemax/ZOS-API research software for post-refractive cornea and non-diffractive EDOF IOL coupling studies."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "customtkinter>=5.2.2",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "pythonnet>=3.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whole_eye_mvp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "unit: pure Python unit tests that do not require OpticStudio",
    "zemax: integration tests that require OpticStudio 2026 R1 and a valid ZOS-API license",
    "gui: CustomTkinter GUI smoke tests",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
