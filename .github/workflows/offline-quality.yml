name: Offline quality gate

on:
  push:
    branches:
      - feat/task-009-fft-mtf-main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Unit tests
        run: uv run pytest tests/unit

      - name: Ruff
        run: uv run ruff check .

      - name: Compileall
        run: uv run python -m compileall -q src tests scripts

      - name: Lock consistency
        run: uv lock --check
