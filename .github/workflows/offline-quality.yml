name: Offline quality gate

on:
  push:
    branches:
      - main
      - feat/task-009-fft-mtf-main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --frozen

      - name: Unit tests
        id: pytest
        continue-on-error: true
        run: uv run pytest tests/unit

      - name: Ruff
        id: ruff
        continue-on-error: true
        run: uv run ruff check .

      - name: Compileall
        id: compileall
        continue-on-error: true
        run: uv run python -m compileall -q src tests scripts

      - name: Lock consistency
        id: lock
        continue-on-error: true
        run: uv lock --check

      - name: Enforce all offline checks
        if: always()
        env:
          PYTEST_OUTCOME: ${{ steps.pytest.outcome }}
          RUFF_OUTCOME: ${{ steps.ruff.outcome }}
          COMPILEALL_OUTCOME: ${{ steps.compileall.outcome }}
          LOCK_OUTCOME: ${{ steps.lock.outcome }}
        run: |
          printf 'pytest=%s\nruff=%s\ncompileall=%s\nlock=%s\n' \
            "$PYTEST_OUTCOME" "$RUFF_OUTCOME" "$COMPILEALL_OUTCOME" "$LOCK_OUTCOME"
          test "$PYTEST_OUTCOME" = success
          test "$RUFF_OUTCOME" = success
          test "$COMPILEALL_OUTCOME" = success
          test "$LOCK_OUTCOME" = success
